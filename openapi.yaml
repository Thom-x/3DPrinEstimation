openapi: 3.1.0
info:
  title: 3D Print STL Estimation
  description: |
    Upload an STL, OBJ, or 3MF file — or pass a public HTTPS URL — and get back
    the estimated filament weight, printing time, and optional material cost,
    powered by OrcaSlicer (PrusaSlicer, Bambu Studio).

    Use `POST /v1/estimates` for new integrations. The legacy
    `POST /slice_and_extract` endpoint remains operational for existing clients.
  contact:
    name: Thomas Maugin
  license:
    name: Proprietary
  version: 1.0.0
  x-category: Tools
  x-long-description: |
    Built for makers, print farms, and quoting tools. Send a 3D model file
    (STL, OBJ, or 3MF) — or a public URL pointing to one — and get back
    the estimated filament weight, printing time, and optional material cost.

    **Why developers like it**
    - Multiple input modes: direct upload OR public HTTPS URL
    - Configurable slicing presets (draft / normal / precision)
    - Custom infill, print speed, support generation, and rotation
    - Optional material cost calculation when you pass `filament_price_per_kg`
    - Clean RFC 7807 error envelopes — predictable HTTP status codes (400, 413, 415)

    **Test in one click**
    The default example uses a hosted sample cube at
    [thom-x.github.io/3DPrinEstimation/samples/cube.stl](https://thom-x.github.io/3DPrinEstimation/samples/cube.stl)
    — click *Test Endpoint* and you'll get a real estimate without
    uploading anything.
servers:
- url: https://3d-print-stl-estimation.p.rapidapi.com
  description: RapidAPI Gateway
- url: /
  description: Self-hosted / Direct backend
security:
- RapidAPIKey: []
  RapidAPIHost: []
tags:
- name: Estimates
  description: "Slice 3D models and return filament, time and cost estimates."
paths:
  /v1/estimates:
    post:
      tags:
      - Estimates
      summary: "Estimate filament, time and cost for a 3D model"
      description: |
        Slices a 3D model file (STL, OBJ, or 3MF) using OrcaSlicer and returns
        the predicted filament weight, printing time, and (optionally) the
        material cost.

        **Input modes** — provide exactly one of:
        - `model_file` — direct multipart upload
        - `model_url` — public HTTPS URL pointing to a 3D model

        **Rotation** (`rotate_x/y/z`) is currently applied to STL files only.

        **Cost calculation** — pass `filament_price_per_kg` (in EUR/kg) to get
        a `cost` block in the response.
      operationId: createEstimate
      parameters:
      - name: model_url
        in: query
        description: Public HTTPS URL of a 3D model (e.g. `https://thom-x.github.io/3DPrinEstimation/samples/cube.stl`).
          Mutually exclusive with `model_file`.
        required: false
        schema:
          type: string
          format: uri
      - name: printer
        in: query
        description: "Optional 3D printer preset (default: `creality_ender3`). Supported:\
          \ `bambulab_p1s`, `bambulab_x1c`, `prusa_mk4`, `creality_k1`, etc., or brand\
          \ aliases `bambulab`, `prusa`, `creality`, `elegoo`."
        required: false
        schema:
          type: string
      - name: material
        in: query
        description: "Optional filament material preset (default: `pla`). Supported:\
          \ `pla`, `petg`, `abs`, `asa`, `tpu`, `pc`, `pa`."
        required: false
        schema:
          type: string
      - name: quality
        in: query
        description: "Optional slicing quality preset or layer height (default: `normal`\
          \ / 0.20mm). Supported: `draft` (0.28mm), `normal` (0.20mm), `precision`\
          \ (0.16mm), or explicit layer heights `0.08`, `0.12`, `0.16`, `0.20`, `0.24`,\
          \ `0.28`, `0.32`."
        required: false
        schema:
          type: string
      - name: layer_height
        in: query
        description: "Optional explicit layer height in mm (0.04 - 0.60). If provided,\
          \ overrides `quality`."
        required: false
        schema:
          type: number
          format: float
          maximum: 0.6
          minimum: 0.04
      - name: fill_density
        in: query
        description: "Optional infill percentage (0-100, default: 20)."
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - name: support_material
        in: query
        description: "Optional support structures generation (default: true)."
        required: false
        schema:
          type: boolean
      - name: speed
        in: query
        description: "Optional print speed in mm/s (15 - 1000). If omitted, uses the\
          \ printer preset's native speed."
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 15
      - name: acceleration
        in: query
        description: "Optional print acceleration in mm/s² (100 - 100000). If omitted,\
          \ uses the printer preset's native acceleration."
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 100
      - name: filament_density
        in: query
        description: "Optional filament density in g/cm³ (0.5 - 5.0). If omitted,\
          \ uses the material preset's density."
        required: false
        schema:
          type: number
          format: float
          maximum: 5.0
          minimum: 0.5
      - name: rotate_x
        in: query
        description: "Optional rotation around the X axis, in degrees (-360 to 360,\
          \ default: 0). STL only."
        required: false
        schema:
          type: integer
          maximum: 360
          minimum: -360
      - name: rotate_y
        in: query
        description: "Optional rotation around the Y axis, in degrees (-360 to 360,\
          \ default: 0). STL only."
        required: false
        schema:
          type: integer
          maximum: 360
          minimum: -360
      - name: rotate_z
        in: query
        description: "Optional rotation around the Z axis, in degrees (-360 to 360,\
          \ default: 0). STL only."
        required: false
        schema:
          type: integer
          maximum: 360
          minimum: -360
      - name: filament_price_per_kg
        in: query
        description: "Optional material price per kg in EUR (e.g. 25.0). If provided,\
          \ the response includes a `cost` block."
        required: false
        schema:
          type: number
          format: float
          minimum: 0.0
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model_file:
                  type: string
                  format: binary
                  description: 3D model file (STL/OBJ/3MF). Mutually exclusive with
                    `model_url`.
            examples:
              minimal_url:
                summary: Minimal — uses a hosted sample STL (no upload needed)
                description: minimal_url
                value:
                  model_url: https://thom-x.github.io/3DPrinEstimation/samples/cube.stl
              with_cost:
                summary: Compute material cost
                description: with_cost
                value:
                  model_url: https://thom-x.github.io/3DPrinEstimation/samples/cube.stl
                  filament_price_per_kg: 25
                  quality: precision
                  fill_density: 30
              full_options:
                summary: All parameters
                description: full_options
                value:
                  model_url: https://thom-x.github.io/3DPrinEstimation/samples/cube.stl
                  quality: normal
                  fill_density: 25
                  support_material: true
                  speed: 80
                  rotate_x: 0
                  rotate_y: 0
                  rotate_z: 90
                  filament_price_per_kg: 22.5
        required: true
      responses:
        "200":
          description: Estimation successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"
              examples:
                basic:
                  summary: Without cost
                  description: basic
                  value:
                    total_filament_used_g: 12.34
                    estimated_printing_time_seconds: 1834
                with_cost:
                  summary: Including material cost
                  description: with_cost
                  value:
                    total_filament_used_g: 12.34
                    estimated_printing_time_seconds: 1834
                    cost:
                      material_cost: 0.31
                      currency: EUR
                      price_per_kg_used: 25.0
        "400":
          description: "Invalid request — bad parameters, unreachable URL, corrupted\
            \ model, or blocked SSRF target."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                validation:
                  summary: Parameter out of range
                  description: validation
                  value:
                    type: https://api.thomx.dev/errors/validation
                    title: Bad Request
                    status: 400
                    detail: "fill_density: must be less than or equal to 100"
                    instance: /v1/estimates
                    timestamp: 2026-05-11T14:32:18Z
                invalid_model:
                  summary: Slicer rejected the model
                  description: invalid_model
                  value:
                    type: https://api.thomx.dev/errors/invalid-model
                    title: Bad Request
                    status: 400
                    detail: The slicer failed to process the model — it may be invalid
                      or corrupted
                    instance: /v1/estimates
                    timestamp: 2026-05-11T14:32:18Z
        "413":
          description: Uploaded file or URL payload exceeds the size limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.thomx.dev/errors/payload-too-large
                title: Payload Too Large
                status: 413
                detail: Uploaded file exceeds the server-configured size limit
                instance: /v1/estimates
                timestamp: 2026-05-11T14:32:18Z
        "415":
          description: Unsupported model format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.thomx.dev/errors/unsupported-format
                title: Unsupported Media Type
                status: 415
                detail: "File extension '.gltf' is not supported. Allowed: stl, obj,\
                  \ 3mf"
                instance: /v1/estimates
                timestamp: 2026-05-11T14:32:18Z
        "500":
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /slice_and_extract:
    post:
      tags:
      - Estimates
      summary: "[Deprecated] Estimate print information from an STL file"
      description: |
        Legacy endpoint preserved for existing clients. Use
        [`POST /v1/estimates`](#operation/createEstimate) for new integrations —
        same slicing engine, cleaner contract, support for OBJ/3MF and `model_url`.
      operationId: sliceAndExtractLegacy
      parameters:
      - name: config_file
        in: query
        description: "Optional slicing configuration preset (default: config.ini)."
        required: false
        schema:
          type: string
          enum:
          - config.ini
          - config_precision.ini
          - config_rough.ini
          pattern: config\.ini|config_precision\.ini|config_rough\.ini
      - name: fill_density
        in: query
        description: "Optional infill percentage (0-100, default: 20)."
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 0
      - name: support_material
        in: query
        description: "Optional support structures generation (default: true)."
        required: false
        schema:
          type: boolean
      - name: speed
        in: query
        description: "Optional print speed in mm/s (15 - 300, default: 100)."
        required: false
        schema:
          type: integer
          maximum: 300
          minimum: 15
      - name: rotate_x
        in: query
        description: "Optional rotation around the X axis in degrees (-360 to 360,\
          \ default: 0)."
        required: false
        schema:
          type: integer
          maximum: 360
          minimum: -360
      - name: rotate_y
        in: query
        description: "Optional rotation around the Y axis in degrees (-360 to 360,\
          \ default: 0)."
        required: false
        schema:
          type: integer
          maximum: 360
          minimum: -360
      - name: rotate_z
        in: query
        description: "Optional rotation around the Z axis in degrees (-360 to 360,\
          \ default: 0)."
        required: false
        schema:
          type: integer
          maximum: 360
          minimum: -360
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                stl_file:
                  type: string
                  format: binary
                  description: STL file to slice.
              required:
              - stl_file
      responses:
        "200":
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"
              example:
                total_filament_used_g: 12.34
                estimated_printing_time_seconds: 1834
        "400":
          description: Invalid input.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: File too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      deprecated: true
  /v1/presets:
    get:
      tags:
      - Estimates
      summary: "List supported 3D printer, material, and quality presets"
      description: |
        Returns the catalog of all supported 3D printer presets (with bed dimensions,
        speed tiers, and brand aliases), filament material presets (with densities and volumetric limits),
        and slicing quality presets.
      operationId: getPresets
      responses:
        "200":
          description: Presets catalog returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetsCatalog"
components:
  schemas:
    Cost:
      type: object
      description: Material cost estimation block — only present when `filament_price_per_kg`
        is provided.
      properties:
        material_cost:
          type: number
          format: double
          description: "Estimated material cost, rounded to 2 decimals."
          example: 0.31
        currency:
          type: string
          description: ISO 4217 currency code of the returned cost.
          example: EUR
        price_per_kg_used:
          type: number
          format: double
          description: Echoes back the price per kg used for the calculation.
          example: 25.0
    EstimateResponse:
      type: object
      description: "Slicing result: predicted filament weight, print time, and optional\
        \ cost."
      properties:
        total_filament_used_g:
          type: number
          format: double
          description: Predicted filament mass in grams.
          example: 12.34
        estimated_printing_time_seconds:
          type: integer
          format: int32
          description: Predicted printing duration in seconds.
          example: 1834
        cost:
          type: "null"
          $ref: "#/components/schemas/Cost"
          description: Material cost block — only returned when `filament_price_per_kg`
            is provided in the request.
        printer:
          type:
          - string
          - "null"
          description: Printer preset used for slicing.
          example: creality_ender3
        material:
          type:
          - string
          - "null"
          description: Material preset used for slicing.
          example: pla
    Problem:
      type: object
      description: RFC 7807 Problem Details error envelope.
      properties:
        type:
          type: string
          description: Problem type identifier (URI).
          example: https://api.thomx.dev/errors/validation
        title:
          type: string
          description: "Short, human-readable summary of the problem."
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: "Detailed, human-readable explanation specific to this occurrence."
          example: "fill_density: must be less than or equal to 100"
        instance:
          type: string
          description: URI of the specific occurrence (the request path).
          example: /v1/estimates
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the error was generated.
          example: 2026-05-11T14:32:18Z
    MaterialPreset:
      type: object
      description: Filament material preset configuration.
      properties:
        id:
          type: string
          description: Identifier of the material preset.
          example: petg
        name:
          type: string
          description: Official slicer material name.
          example: Generic PETG
        displayName:
          type: string
          description: Human-friendly display name.
          example: PETG
        density:
          type: number
          format: double
          description: Filament density in g/cm³.
          example: 1.27
        maxVolumetricSpeed:
          type: number
          format: double
          description: Maximum volumetric speed in mm³/s.
          example: 12.0
        defaultPricePerKg:
          type: number
          format: double
          description: Default reference price per kg in EUR.
          example: 22.0
        configFile:
          type: string
          description: Relative path to preset configuration file.
          example: presets/materials/petg.json
        aliases:
          type: array
          description: List of alias identifiers for this material.
          example:
          - pet
          items:
            type: string
    PresetsCatalog:
      type: object
      description: "Catalog of all supported printer, material, and quality presets."
      properties:
        printers:
          type: array
          items:
            $ref: "#/components/schemas/PrinterPreset"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialPreset"
        qualities:
          type: array
          items:
            $ref: "#/components/schemas/QualityPreset"
    PrinterPreset:
      type: object
      description: 3D printer preset configuration.
      properties:
        id:
          type: string
          description: Identifier of the printer preset.
          example: bambulab_p1s
        name:
          type: string
          description: Official slicer profile name.
          example: Bambu Lab P1S 0.4 nozzle
        displayName:
          type: string
          description: Human-friendly display name.
          example: Bambu Lab P1S
        manufacturer:
          type: string
          description: Manufacturer of the printer.
          example: Bambu Lab
        bedSize:
          type: array
          description: "Print bed size [X, Y, Z] in mm."
          example:
          - 256
          - 256
          - 250
          items:
            type: integer
            format: int32
        speedTier:
          type: string
          description: "Speed tier (slow, medium, fast)."
          example: fast
        defaultSpeed:
          type: integer
          format: int32
          description: Default print speed in mm/s.
          example: 250
        defaultAcceleration:
          type: integer
          format: int32
          description: Default acceleration in mm/s².
          example: 20000
        configFile:
          type: string
          description: Relative path to preset configuration file.
          example: presets/printers/bambulab_p1s.json
        aliases:
          type: array
          description: List of alias identifiers for this printer.
          example:
          - bambulab
          - p1s
          items:
            type: string
    QualityPreset:
      type: object
      description: Slicing quality / layer height preset.
      properties:
        id:
          type: string
          description: Identifier of the quality preset.
          example: normal
        layerHeight:
          type: number
          format: double
          description: Layer height in mm.
          example: 0.2
        displayName:
          type: string
          description: Human-friendly display name.
          example: 0.20mm Standard
        aliases:
          type: array
          description: List of alias identifiers for this quality preset.
          example:
          - "0.20"
          - standard
          items:
            type: string
  securitySchemes:
    RapidAPIKey:
      type: apiKey
      description: API key issued by RapidAPI Hub.
      name: X-RapidAPI-Key
      in: header
    RapidAPIHost:
      type: apiKey
      description: "RapidAPI Host: 3d-print-stl-estimation.p.rapidapi.com"
      name: X-RapidAPI-Host
      in: header
