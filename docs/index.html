<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Print Estimation API — Swagger UI</title>
  <link rel="icon" type="image/svg+xml" href="../logo.svg">
  <link rel="alternate icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
    }
    .custom-header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .custom-header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #0f172a;
    }
    .custom-header .brand img {
      width: 34px;
      height: 34px;
      display: block;
    }
    .custom-header .brand-text {
      display: flex;
      flex-direction: column;
    }
    .custom-header .brand-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }
    .custom-header .brand-subtitle {
      font-size: 11px;
      color: #64748b;
      line-height: 1.2;
    }
    .custom-header .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .custom-header .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .custom-header .nav-link:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .custom-header .nav-link.primary {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    .custom-header .nav-link.primary:hover {
      background: #0369a1;
      border-color: #0369a1;
    }
    /* Hide Swagger's default topbar since we have our custom styled header */
    .swagger-ui .topbar {
      display: none;
    }
    .swagger-ui .wrapper {
      max-width: 1280px;
      padding: 24px 20px;
      margin: 0 auto;
    }
    .swagger-ui .info {
      margin: 20px 0 30px 0;
    }
    .swagger-ui .info .title {
      color: #0f172a;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <header class="custom-header">
    <a href="../" class="brand">
      <img src="../logo.svg" alt="3D Print Estimation Logo">
      <div class="brand-text">
        <span class="brand-title">3D Print Estimation API</span>
        <span class="brand-subtitle">Interactive Swagger UI Documentation</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="../" class="nav-link">&larr; Back to Studio</a>
      <a href="../openapi.json" target="_blank" download="openapi.json" class="nav-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        OpenAPI (JSON)
      </a>
      <a href="../openapi.yaml" target="_blank" download="openapi.yaml" class="nav-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        OpenAPI (YAML)
      </a>
    </nav>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "../openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        docExpansion: "list",
        filter: true,
        showRequestHeaders: true,
        persistAuthorization: true,
        requestInterceptor: function(req) {
          if (req.url && req.url.indexOf('rapidapi.com') !== -1) {
            req.headers['X-RapidAPI-Host'] = '3d-print-stl-estimation.p.rapidapi.com';
          }
          return req;
        },
        onComplete: function() {
          // Pre-authorize the host header so user only has to paste their RapidAPI key
          if (window.ui && window.ui.preauthorizeApiKey) {
            window.ui.preauthorizeApiKey('RapidAPIHost', '3d-print-stl-estimation.p.rapidapi.com');
          }
        }
      });
    };
  </script>
</body>
</html>
