<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="spoolRim_abs" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#334155" />
      <stop offset="95%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="filamentGrad_abs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow_abs" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Spool Outer Flange -->
  <circle cx="100" cy="100" r="90" fill="url(#spoolRim_abs)" filter="url(#shadow_abs)" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Filament Coil (Coiled Wound Ring) -->
  <circle cx="100" cy="100" r="76" fill="url(#filamentGrad_abs)" />
  
  <!-- Realistic winding texture rings -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#ffedd5" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 4" />
  <circle cx="100" cy="100" r="66" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="12 6" />
  <circle cx="100" cy="100" r="60" fill="none" stroke="#ffedd5" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 3" />
  <circle cx="100" cy="100" r="54" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="14 5" />
  <circle cx="100" cy="100" r="48" fill="none" stroke="#ffedd5" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="10 4" />

  <!-- Spool Inner Core / Hub -->
  <circle cx="100" cy="100" r="42" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <circle cx="100" cy="100" r="38" fill="#0f172a" />
  <circle cx="100" cy="100" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Center Spindle Hole -->
  <circle cx="100" cy="100" r="14" fill="#0f172a" />

  <!-- Flange weight/view cutouts (classic Bambu/Prusa hex / oval windows) -->
  <circle cx="100" cy="38" r="6" fill="#0f172a" opacity="0.8" />
  <circle cx="100" cy="162" r="6" fill="#0f172a" opacity="0.8" />
  <circle cx="38" cy="100" r="6" fill="#0f172a" opacity="0.8" />
  <circle cx="162" cy="100" r="6" fill="#0f172a" opacity="0.8" />

  <!-- Badge Label -->
  <rect x="74" y="88" width="52" height="24" rx="4" fill="#ffffff" filter="url(#shadow_abs)" />
  <text x="100" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="12" fill="#ea580c" text-anchor="middle" letter-spacing="0.5">ABS</text>
</svg>